- title: "The Gene"
  creator: "Siddhartha Mukherjee"
  image: "files/images/shelf/book-the-gene.jpg"
  medium_class: "shelf-book"
  note: "A panoramic history of genetics from Mendel to modern gene editing and human heredity."

- title: "The Selfish Gene"
  creator: "Richard Dawkins"
  image: "files/images/shelf/book-the-selfish-gene.jpg"
  medium_class: "shelf-book"
  note: "The foundational work articulating the gene-centric view of evolution and replicator dynamics."

- title: "The Extended Phenotype"
  creator: "Richard Dawkins"
  image: "files/images/shelf/book-the-extended-phenotype.jpg"
  medium_class: "shelf-book"
  note: "Dawkins's masterwork demonstrating that phenotypic gene expression extends outward into the environment."

- title: "The Red Queen"
  creator: "Matt Ridley"
  image: "files/images/shelf/book-the-red-queen.jpg"
  medium_class: "shelf-book"
  note: "An investigation into sexual reproduction and the co-evolutionary arms race between species."

- title: "The Mating Mind"
  creator: "Geoffrey Miller"
  image: "files/images/shelf/book-the-mating-mind.jpg"
  medium_class: "shelf-book"
  note: "A thesis proposing human intelligence, humor, and art evolved through sexual selection as courtship adaptations."
