<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <rect width="200" height="300" fill="#fcfbf7"/>
  <rect x="0" y="0" width="12" height="300" fill="#f1ece1"/>
  <line x1="12" y1="0" x2="12" y2="300" stroke="#e2d9c8" stroke-width="1"/>
  
  <!-- Recursive isometric cube motif -->
  <g stroke="#171717" stroke-width="1.2" fill="none" opacity="0.8">
    <!-- Outer cube -->
    <path d="M 100 120 L 140 142 L 140 190 L 100 212 L 60 190 L 60 142 Z"/>
    <line x1="100" y1="120" x2="100" y2="168"/>
    <line x1="100" y1="168" x2="140" y2="142"/>
    <line x1="100" y1="168" x2="60" y2="142"/>
    <!-- Inner recursive triangle -->
    <polygon points="100,140 125,180 75,180" stroke="#b45309" stroke-width="1" fill="#fef3c7" fill-opacity="0.3"/>
  </g>

  <text x="30" y="48" fill="#78716c" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="8" letter-spacing="1.5" text-transform="uppercase">Douglas R. Hofstadter</text>
  <text x="30" y="76" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-weight="700" font-size="17" letter-spacing="-0.5">GÖDEL, ESCHER,</text>
  <text x="30" y="96" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-weight="700" font-size="17" letter-spacing="-0.5">BACH</text>
  <text x="30" y="112" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="7.5" letter-spacing="0.5">AN ETERNAL GOLDEN BRAID</text>

  <text x="30" y="272" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="7.5" letter-spacing="0.8">PULITZER PRIZE WINNER</text>
</svg>
