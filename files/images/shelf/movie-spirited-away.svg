<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <rect width="200" height="300" fill="#1e1b4b"/>

  <!-- Sunset sea gradient -->
  <linearGradient id="spirited" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#4c1d95"/>
    <stop offset="40%" stop-color="#be185d"/>
    <stop offset="65%" stop-color="#f97316"/>
    <stop offset="70%" stop-color="#0369a1"/>
    <stop offset="100%" stop-color="#082f49"/>
  </linearGradient>
  <rect width="200" height="300" fill="url(#spirited)" opacity="0.9"/>

  <!-- Railroad tracks on water -->
  <line x1="100" y1="205" x2="30" y2="300" stroke="#fbcfe8" stroke-width="1.2" opacity="0.8"/>
  <line x1="100" y1="205" x2="170" y2="300" stroke="#fbcfe8" stroke-width="1.2" opacity="0.8"/>
  <line x1="75" y1="240" x2="125" y2="240" stroke="#fbcfe8" stroke-width="1" opacity="0.6"/>
  <line x1="55" y1="270" x2="145" y2="270" stroke="#fbcfe8" stroke-width="1" opacity="0.6"/>

  <!-- Train silhouette with lit windows -->
  <rect x="75" y="190" width="50" height="18" fill="#18181b" rx="2"/>
  <circle cx="85" cy="198" r="2.5" fill="#fef08a"/>
  <circle cx="95" cy="198" r="2.5" fill="#fef08a"/>
  <circle cx="105" cy="198" r="2.5" fill="#fef08a"/>
  <circle cx="115" cy="198" r="2.5" fill="#fef08a"/>

  <text x="100" y="38" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="7" letter-spacing="2">HAYAO MIYAZAKI</text>
  <text x="100" y="62" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-weight="700" font-size="16" letter-spacing="0.5">SPIRITED AWAY</text>

  <text x="100" y="286" text-anchor="middle" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="6.5" letter-spacing="1">STUDIO GHIBLI • 2001</text>
</svg>
