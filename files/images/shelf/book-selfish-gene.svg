<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <rect width="200" height="300" fill="#1e293b"/>
  <rect x="0" y="0" width="12" height="300" fill="#0f172a"/>
  <!-- Spine shadow -->
  <line x1="12" y1="0" x2="12" y2="300" stroke="#334155" stroke-width="1"/>
  
  <!-- Minimalist DNA / Gene abstract geometric line -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 40 140 Q 70 120 100 140 T 160 140"/>
    <path d="M 40 160 Q 70 180 100 160 T 160 160"/>
    <line x1="60" y1="127" x2="60" y2="173" stroke="#94a3b8" stroke-width="1"/>
    <line x1="100" y1="140" x2="100" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <line x1="140" y1="133" x2="140" y2="167" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <text x="30" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="9" letter-spacing="1.5" text-transform="uppercase">Richard Dawkins</text>
  <text x="30" y="85" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-weight="600" font-size="16" letter-spacing="-0.5">THE SELFISH</text>
  <text x="30" y="105" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-weight="600" font-size="16" letter-spacing="-0.5">GENE</text>

  <text x="30" y="270" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Geist Mono', monospace" font-size="8" letter-spacing="1">OXFORD LANDMARK SCIENCE</text>
</svg>
